[project]
name = "emporio-music-backend"
version = "0.1.0"
description = "Customer-support agent backend for the Artefact AI Engineer challenge."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.123",
    "pydantic>=2,<3",
    "pydantic-ai-slim[bedrock]>=2.64.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
