services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: emporio-da-musica:local
    env_file:
      - .env
    environment:
      HF_HOME: /app/data/benchmark-cache/hf
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-data:/app/data

volumes:
  app-data:
