[project]
name = "emporio-music-backend"
version = "0.1.0"
description = "Customer-support agent backend for the Artefact AI Engineer challenge."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "pydantic>=2,<3",
    "pydantic-ai-slim[bedrock]>=2.64.0",
    "pydantic-settings>=2.14,<3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
policy-rag = [
    "chromadb>=1,<2",
    "sentence-transformers>=5,<6",
    "torch>=2,<3",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[dependency-groups]
benchmark = [ "sentence-transformers>=5,<6", "torch>=2,<3"]
dev = [
    "chromadb>=1,<2",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "python-dotenv>=1.2.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# The small local embedding benchmark uses CPU; avoid CUDA runtime downloads.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
