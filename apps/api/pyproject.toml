[project]
name = "emporio-music-api"
version = "0.1.0"
description = "FastAPI application for the Empório da Música customer-support agent."
requires-python = ">=3.12"
dependencies = [
    "emporio-music>=0.1.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
policy-rag = ["emporio-music[policy-rag]>=0.1.0"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.3",
]

[tool.uv.sources]
emporio-music = { workspace = true }
