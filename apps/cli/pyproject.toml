[project]
name = "emporio-music-cli"
version = "0.1.0"
description = "Interactive terminal client for the Empório da Música agent."
requires-python = ">=3.12"
dependencies = ["emporio-music>=0.1.0"]

[project.scripts]
emporio-music-chat = "emporio_music_cli.cli:main"

[project.optional-dependencies]
policy-rag = ["emporio-music[policy-rag]>=0.1.0"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
emporio-music = { workspace = true }

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.2.0", "ruff>=0.17.3"]
