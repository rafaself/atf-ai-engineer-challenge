[tool.uv.workspace]
members = ["packages/emporio_music", "apps/api", "apps/cli"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "apps/cli/tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
